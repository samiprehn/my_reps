<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reps</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2">🏛️ My Reps</h1>
            <p class="text-gray-600 text-sm">See how your senators and House rep have been voting.</p>
        </div>

        <div id="addressSection" class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Enter Your Address</h2>
            <form id="addressForm" class="space-y-3" onsubmit="event.preventDefault(); findReps();">
                <input type="text" id="street" name="street" autocomplete="address-line1" placeholder="Street address" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="city" name="city" autocomplete="address-level2" placeholder="City" required
                        class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                    <input type="text" id="state" name="state" autocomplete="address-level1" placeholder="State" required maxlength="2"
                        class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent uppercase" />
                    <input type="text" id="zip" name="zip" autocomplete="postal-code" placeholder="ZIP" required inputmode="numeric"
                        class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                    Find My Reps
                </button>
            </form>
            <div id="error" class="mt-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg hidden"></div>
            <div id="loading" class="mt-4 text-center text-gray-600 hidden">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                <p class="mt-2">Looking up your district...</p>
            </div>
        </div>

        <div id="results" class="hidden">
            <div id="addressBar" class="bg-white rounded-xl shadow p-4 mb-6 text-sm text-gray-600 flex justify-between items-center">
                <span id="addressBarText"></span>
                <button onclick="resetForm()" class="text-indigo-600 hover:underline">change address</button>
            </div>
            <div id="cards" class="space-y-6"></div>
        </div>

        <div class="text-center mt-8 mb-4 text-gray-400 text-sm">
            <a href="https://buymeacoffee.com/samiprehn" target="_blank" rel="noopener noreferrer" class="hover:text-gray-600 transition-colors" style="text-decoration: none;">Keep this page running</a>
            <span class="mx-2 opacity-60">|</span>
            <a href="https://samiprehn.github.io/" target="_blank" rel="noopener noreferrer" class="hover:text-gray-600 transition-colors" style="text-decoration: none;">Sami's other sites →</a>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'my_reps_address';

        // Escape API strings before inserting into innerHTML
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        const GEOCODE_WORKER = 'https://my-reps.sami-prehn.workers.dev';

        async function geocodeAddress(address) {
            // Census Geocoder doesn't send CORS headers, route through our Cloudflare Worker
            const url = `${GEOCODE_WORKER}?address=${encodeURIComponent(address)}`;
            const r = await fetch(url);
            if (!r.ok) throw new Error('Address lookup failed');
            const data = await r.json();
            const match = data.result?.addressMatches?.[0];
            if (!match) throw new Error('Could not find that address. Check spelling and include city, state, and ZIP.');

            const geo = match.geographies;
            // Find congressional district by regex match — layer name varies by Congress (119th, 120th, ...)
            const cdKey = Object.keys(geo).find(k => /Congressional District/i.test(k));
            if (!cdKey || !geo[cdKey]?.[0]) throw new Error('No congressional district found for that address.');
            const cd = geo[cdKey][0];
            const stateObj = geo.States?.[0];
            if (!stateObj) throw new Error('Could not determine state.');

            // At-large states (SD, ND, WY, VT, DE, AK) have BASENAME "(at Large)" → district 0,
            // which is also how congress-legislators numbers at-large seats.
            const parsedDistrict = parseInt(cd.BASENAME, 10);
            const district = Number.isNaN(parsedDistrict) ? 0 : parsedDistrict;

            return {
                state: stateObj.STUSAB,
                stateName: stateObj.NAME,
                district,
                matchedAddress: match.matchedAddress
            };
        }

        // Congress data from the unitedstates/congress-legislators project (static JSON, CORS-enabled).
        // GovTrack's API started serving Cloudflare challenges (Oct 2026), which browsers can't pass.
        const CL = 'https://unitedstates.github.io/congress-legislators';
        let congressData = null;
        function loadCongressData() {
            if (!congressData) {
                const get = (f) => fetch(`${CL}/${f}`).then(r => { if (!r.ok) throw new Error('Could not load Congress data'); return r.json(); });
                congressData = Promise.all([
                    get('legislators-current.json'),
                    get('committee-membership-current.json'),
                    get('committees-current.json')
                ]).then(([legislators, membership, committees]) => {
                    const committeeNames = Object.fromEntries(committees.map(c => [c.thomas_id, c.name]));
                    // Full committees only (subcommittee ids have a numeric suffix, e.g. SSAF13)
                    const committeesByMember = {};
                    for (const [id, members] of Object.entries(membership)) {
                        if (!committeeNames[id]) continue;
                        for (const m of members) {
                            (committeesByMember[m.bioguide] ||= []).push({ name: committeeNames[id], title: m.title });
                        }
                    }
                    return { legislators, committeesByMember };
                });
                congressData.catch(() => { congressData = null; });
            }
            return congressData;
        }

        const currentTerm = (leg) => leg.terms[leg.terms.length - 1];

        // Sponsored bills + recent votes via our Worker (Congress.gov / senate.gov; key lives in the Worker)
        const recordCache = {};
        function fetchRecord(leg) {
            const id = leg.id.bioguide;
            if (!recordCache[id]) {
                const j = (r) => r.ok ? r.json() : null;
                const votesQs = currentTerm(leg).type === 'sen' ? `chamber=senate&lis=${leg.id.lis}` : `chamber=house&bioguide=${id}`;
                recordCache[id] = Promise.all([
                    fetch(`${GEOCODE_WORKER}/bills?bioguide=${id}`).then(j),
                    fetch(`${GEOCODE_WORKER}/votes?${votesQs}`).then(j)
                ]).then(([bills, votes]) => ({ bills, votes: votes?.votes || [] }));
                recordCache[id].catch(() => { delete recordCache[id]; });
            }
            return recordCache[id];
        }

        // Congress.gov only gives each bill's latest action, so stage is inferred from its text
        const BILL_GROUPS = [
            { label: 'Enacted', test: /became (public|private) law|signed by president/i },
            { label: 'Passed a Chamber', test: /passed (house|senate)|passed\/agreed to|agreed to in (house|senate)|resolution agreed to|presented to president|received in the (house|senate)|held at the desk|cleared for white house/i },
            { label: 'Passed Committee', test: /reported|placed on (the )?(union|house|senate legislative) calendar/i },
            { label: 'Introduced', test: /./ },
        ];
        const BILL_LABELS = { HR: 'H.R.', S: 'S.', HRES: 'H.Res.', SRES: 'S.Res.', HJRES: 'H.J.Res.', SJRES: 'S.J.Res.', HCONRES: 'H.Con.Res.', SCONRES: 'S.Con.Res.' };
        const BILL_SLUGS = { HR: 'house-bill', S: 'senate-bill', HRES: 'house-resolution', SRES: 'senate-resolution', HJRES: 'house-joint-resolution', SJRES: 'senate-joint-resolution', HCONRES: 'house-concurrent-resolution', SCONRES: 'senate-concurrent-resolution' };
        const ordinal = (n) => n + ([11, 12, 13].includes(n % 100) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
        const billUrl = (b) => `https://www.congress.gov/bill/${ordinal(b.congress)}-congress/${BILL_SLUGS[b.type] || 'house-bill'}/${b.number}`;

        function renderRecord(r) {
            let html = '';
            const bills = r.bills?.bills || [];
            let billsHtml = '';
            let billsDisplayed = 0;
            const remaining = new Set(bills);
            BILL_GROUPS.forEach(group => {
                const inGroup = bills.filter(b => remaining.has(b) && group.test.test(b.latestAction));
                inGroup.forEach(b => remaining.delete(b));
                const limit = group.label === 'Introduced' ? Math.min(5, 20 - billsDisplayed) : 20 - billsDisplayed;
                const toShow = inGroup.slice(0, limit);
                if (toShow.length === 0) return;
                billsHtml += `<div class="mt-2">
                    <div class="text-xs font-medium text-gray-500 uppercase tracking-wide">${group.label} <span class="text-gray-400 normal-case">(${inGroup.length})</span></div>
                    <ul class="list-disc list-inside text-gray-600 space-y-0.5">
                        ${toShow.map(b => {
                            const title = b.title || 'Untitled';
                            const truncated = title.length > 100 ? title.substring(0, 100) + '…' : title;
                            return `<li><a href="${billUrl(b)}" target="_blank" rel="noopener noreferrer" class="hover:underline">${esc(BILL_LABELS[b.type] || b.type)} ${esc(b.number)}: ${esc(truncated)}</a> <span class="text-gray-400">(${esc(b.introducedDate?.substring(0, 4) || '')})</span></li>`;
                        }).join('')}
                    </ul>
                </div>`;
                billsDisplayed += toShow.length;
            });
            if (billsHtml) {
                html += `<div class="mb-4">
                    <h4 class="font-semibold text-gray-700 mb-1">Bills Sponsored <span class="text-xs font-normal text-gray-400">(${r.bills.total} total)</span></h4>
                    ${billsHtml}
                </div>`;
            }

            if (r.votes.length > 0) {
                html += `<div>
                    <h4 class="font-semibold text-gray-700 mb-2">Recent Votes <span class="text-xs font-normal text-gray-400">(✓ on winning side, ✗ on losing side)</span></h4>
                    <ul class="space-y-2">
                        ${r.votes.map(v => {
                            const date = v.date ? new Date(v.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
                            const opt = v.cast || '—';
                            const winLabel = v.withWinner != null ? (v.withWinner ? ' ✓' : ' ✗') : '';
                            const optColor = (opt === 'Yea' || opt === 'Aye') ? 'text-green-700 bg-green-50'
                                : (opt === 'Nay' || opt === 'No') ? 'text-red-700 bg-red-50'
                                : 'text-gray-600 bg-gray-100';
                            const question = v.question.length > 140 ? v.question.substring(0, 140) + '…' : v.question;
                            return `
                                <li class="border-b border-gray-100 last:border-b-0 pb-2 last:pb-0 flex gap-3 items-start">
                                    <span class="text-xs text-gray-400 whitespace-nowrap mt-0.5 w-20 flex-shrink-0">${date}</span>
                                    <span class="flex-1"><a href="${v.link}" target="_blank" rel="noopener noreferrer" class="text-gray-800 hover:underline">${esc(question)}</a> <span class="text-gray-400 text-xs">(${esc(v.result)} ${v.yeas}–${v.nays})</span></span>
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded ${optColor} whitespace-nowrap">${esc(opt)}${winLabel}</span>
                                </li>
                            `;
                        }).join('')}
                    </ul>
                </div>`;
            }
            return html;
        }

        function readAddress() {
            const street = document.getElementById('street').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();
            const zip = document.getElementById('zip').value.trim();
            if (!street || !city || !state || !zip) return null;
            return { street, city, state, zip, full: `${street}, ${city}, ${state} ${zip}` };
        }

        async function findReps() {
            const parts = readAddress();
            if (!parts) return showError('Please fill in all address fields');
            const address = parts.full;

            hideError();
            document.getElementById('loading').classList.remove('hidden');

            try {
                const [loc, data] = await Promise.all([geocodeAddress(address), loadCongressData()]);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(parts));

                const inState = data.legislators.filter(l => currentTerm(l).state === loc.state);
                const senators = inState.filter(l => currentTerm(l).type === 'sen');
                const houseReps = inState.filter(l => currentTerm(l).type === 'rep' && currentTerm(l).district === loc.district);

                const reps = [...senators, ...houseReps];
                if (reps.length === 0) throw new Error('No current representatives found.');

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('addressSection').classList.add('hidden');
                document.getElementById('results').classList.remove('hidden');
                document.getElementById('addressBarText').textContent = `${loc.matchedAddress} · ${loc.stateName} District ${loc.district}`;

                renderCards(reps, data.committeesByMember);
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                showError(err.message);
            }
        }

        function renderCards(reps, committeesByMember) {
            const container = document.getElementById('cards');
            container.innerHTML = '';

            const YEAR = 365.25 * 24 * 60 * 60 * 1000;
            reps.forEach(leg => {
                const term = currentTerm(leg);
                const first = leg.name.nickname || leg.name.first;
                const photoUrl = `https://unitedstates.github.io/images/congress/225x275/${leg.id.bioguide}.jpg`;
                const partyColor = term.party === 'Democrat' ? 'text-blue-600' : term.party === 'Republican' ? 'text-red-600' : 'text-gray-600';
                const subtitle = term.type === 'sen'
                    ? `Senator · ${term.state}`
                    : `Representative · ${term.state}-${term.district}`;

                const firstStart = leg.terms[0].start;
                const yearsInCongress = Math.floor((new Date() - new Date(firstStart)) / YEAR);
                const age = leg.bio?.birthday ? Math.floor((new Date() - new Date(leg.bio.birthday)) / YEAR) : null;
                const bioBits = [];
                if (age !== null) bioBits.push(`Age ${age}`);
                bioBits.push(`${yearsInCongress} yr in Congress`);
                const linkCls = 'text-indigo-600 hover:underline';
                if (leg.id.govtrack) bioBits.push(`<a href="https://www.govtrack.us/congress/members/${leg.id.govtrack}" target="_blank" rel="noopener noreferrer" class="${linkCls}">GovTrack</a>`);
                if (leg.id.opensecrets) bioBits.push(`<a href="https://www.opensecrets.org/members-of-congress/summary?cid=${esc(leg.id.opensecrets)}" target="_blank" rel="noopener noreferrer" class="${linkCls}">OpenSecrets</a>`);

                const committees = committeesByMember[leg.id.bioguide] || [];
                const committeesHtml = committees.length === 0 ? '' : `<div class="mb-4">
                        <h4 class="font-semibold text-gray-700 mb-1">Committees</h4>
                        <ul class="list-disc list-inside text-gray-600 space-y-0.5">
                            ${committees.map(cm => `<li>${esc(cm.name)}${cm.title ? ` <span class="text-gray-400">(${esc(cm.title)})</span>` : ''}</li>`).join('')}
                        </ul>
                    </div>`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-lg p-6';
                card.innerHTML = `
                    <div class="flex items-center gap-4 mb-4">
                        <img src="${photoUrl}" alt="${esc(first)} ${esc(leg.name.last)}" class="w-16 h-16 rounded-full object-cover object-top bg-gray-200" onerror="this.style.display='none'">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-gray-800">${esc(first)} ${esc(leg.name.last)}</h3>
                            <p class="text-sm ${partyColor}">${esc(term.party)} · ${subtitle}</p>
                            <div class="bio text-xs text-gray-500 mt-1">${bioBits.join(' · ')}</div>
                        </div>
                    </div>
                    <div class="record text-sm text-gray-600">
                        ${committeesHtml}
                        <div class="record-detail text-gray-500">Loading bills and votes…</div>
                    </div>
                `;
                container.appendChild(card);

                const detail = card.querySelector('.record-detail');
                fetchRecord(leg).then(r => {
                    detail.innerHTML = renderRecord(r) || '<p class="text-gray-500 italic">No bills or votes found.</p>';
                }).catch(() => {
                    detail.innerHTML = '<p class="text-gray-500 italic">Could not load bills and votes.</p>';
                });
            });
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() { document.getElementById('error').classList.add('hidden'); }

        function resetForm() {
            document.getElementById('results').classList.add('hidden');
            document.getElementById('addressSection').classList.remove('hidden');
            document.getElementById('cards').innerHTML = '';
            hideError();
        }

        // Auto-load on visit if we have a saved address
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const p = JSON.parse(saved);
                document.getElementById('street').value = p.street || '';
                document.getElementById('city').value = p.city || '';
                document.getElementById('state').value = p.state || '';
                document.getElementById('zip').value = p.zip || '';
                findReps();
            } catch (e) { /* old format, ignore */ }
        }
    </script>
</body>
</html>
